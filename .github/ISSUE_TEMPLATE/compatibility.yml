name: Compatibility report
description: Report a reproducible Persian/RTL rendering issue without confidential content.
title: '[Compatibility]: '
labels: ['compatibility']
body:
  - type: input
    id: mattermost-version
    attributes:
      label: Mattermost version and build
      placeholder: 11.10.1 / exact build hash if available
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Client and version
      placeholder: Chrome 139, Firefox 142, or Mattermost Desktop 6.3.0
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor or surface
      options:
        - Plain-text composer
        - Rich-text/Tiptap composer
        - Rendered post
        - Search or quick switcher
        - Channel label or description
        - Other
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal non-confidential sample and steps
      description: Replace real names, server URLs, tokens, and message content with safe fixtures.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
