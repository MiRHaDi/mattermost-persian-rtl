name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    if: github.repository == 'MiRHaDi/mattermost-persian-rtl'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify tag matches plugin version
        shell: bash
        run: test "v$(node -p "require('./plugin.json').version")" = "$GITHUB_REF_NAME"

      - name: Build and verify release bundle
        run: |
          npm ci
          npm run check
          sha256sum dist/*.tar.gz > dist/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
