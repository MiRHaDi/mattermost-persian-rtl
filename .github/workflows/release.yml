name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'MiRHaDi/mattermost-persian-rtl'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Verify tag matches plugin version
        shell: bash
        run: |
          expected="v$(node -p "require('./plugin.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Tag $GITHUB_REF_NAME does not match $expected" >&2
            exit 1
          }
      - run: npm run release:check
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/ir.mirhadi.mattermost-persian-rtl-*.tar.gz
          dist/SHA256SUMS
          dist/release-manifest.json
          --verify-tag
          --generate-notes
          --prerelease
          --title "Mattermost Persian & RTL Support $GITHUB_REF_NAME"
